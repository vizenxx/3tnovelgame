    <title>命运干涉</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #050508;
        color: #c5c6cb;
        color-scheme: dark;
        font-family: "Plus Jakarta Sans", "Noto Sans SC", system-ui, -apple-system, sans-serif;
      }

      #root {
        min-height: 100dvh;
        background: #050508;
      }

      /* ── Boot Splash ───────────────────────────────────────── */
      .boot-splash {
        position: relative;
        display: flex;
        min-height: 100dvh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        text-align: center;
        /* warm literary dark background */
        background:
          radial-gradient(ellipse 72% 48% at 50% 34%, rgba(129, 140, 248, 0.09) 0%, transparent 66%),
          radial-gradient(ellipse 60% 42% at 50% 58%, rgba(176, 132, 72, 0.055) 0%, transparent 68%),
          linear-gradient(180deg, #08080d 0%, #050507 58%, #080705 100%);
      }

      /* subtle paper-grain noise overlay */
      .boot-splash::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.035'/%3E%3C/svg%3E");
        background-size: 256px 256px;
        pointer-events: none;
        opacity: 0.6;
      }

      /* ── Centre stage ──────────────────────────────────────── */
      .boot-cover-main {
        display: flex;
        min-height: 52dvh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
      }

      /* ── Icon area ─────────────────────────────────────────── */
      .boot-mark {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 148px;
        height: 148px;
      }

      /* warm radial glow behind icon */
      .boot-mark::before {
        content: "";
        position: absolute;
        inset: -34px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(129, 140, 248, 0.22) 0%,
          rgba(176, 132, 72, 0.06) 42%,
          transparent 72%
        );
        animation: boot-glow-pulse 3.2s ease-in-out infinite;
      }

      /* the icon itself */
      .boot-mark img {
        position: relative;
        z-index: 1;
        width: 120px;
        height: 120px;
        object-fit: contain;
        filter:
          drop-shadow(0 0 18px rgba(129, 140, 248, 0.42))
          drop-shadow(0 0 48px rgba(99, 118, 240, 0.16))
          drop-shadow(0 10px 30px rgba(0, 0, 0, 0.48));
        animation: boot-icon-in 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      /* sweeping light band — clipped to circle */
      .boot-mark::after {
        display: none;
      }

      /* ── Text block ────────────────────────────────────────── */
      .boot-text {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        animation: boot-text-in 1s cubic-bezier(0.16, 1, 0.3, 1) 0.25s both;
      }

      .boot-label {
        color: #5a5a6a;
        font-size: 10.5px;
        font-weight: 900;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        font-family: "Outfit", sans-serif;
      }

      .boot-title {
        color: #dedfe3;
        font-size: clamp(38px, 10vw, 62px);
        font-weight: 900;
        letter-spacing: -0.045em;
        line-height: 1;
        font-family: "Outfit", "Noto Sans SC", sans-serif;
        text-shadow:
          0 0 48px rgba(129, 140, 248, 0.2),
          0 2px 0 rgba(0, 0, 0, 0.6),
          0 16px 40px rgba(0, 0, 0, 0.45);
      }

      .boot-tagline {
        margin-top: 4px;
        color: #3e3e4a;
        font-size: 11.5px;
        font-weight: 500;
        letter-spacing: 0.06em;
        font-family: "Plus Jakarta Sans", "Noto Sans SC", sans-serif;
      }

      /* ── Progress area ─────────────────────────────────────── */
      .boot-progress-wrap {
        position: fixed;
        bottom: max(40px, calc(env(safe-area-inset-bottom) + 30px));
        right: 0;
        left: 0;
        width: min(240px, calc(100vw - 48px));
        margin-inline: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        z-index: 10;
        animation: boot-text-in 1s cubic-bezier(0.16, 1, 0.3, 1) 0.5s both;
      }

      /* thin literary rule line */
      .boot-progress {
        width: 100%;
        height: 1px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 999px;
        overflow: visible;
        position: relative;
      }

      .boot-progress-fill {
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg,
          rgba(80, 95, 200, 0.5),
          rgba(160, 120, 60, 0.55) 60%,
          rgba(80, 95, 200, 0.4)
        );
        animation: boot-progress 6.5s ease-out forwards;
        width: 12%;
        position: relative;
      }

      /* glint dot at leading edge */
      .boot-progress-fill::after {
        content: "";
        position: absolute;
        right: -1px;
        top: -2px;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: rgba(180, 160, 110, 0.9);
        box-shadow: 0 0 6px 2px rgba(160, 130, 80, 0.5);
      }

      .boot-percent {
        color: #3a3a46;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.2em;
        font-family: "Outfit", sans-serif;
        font-variant-numeric: tabular-nums;
      }

      /* ── Keyframes ─────────────────────────────────────────── */
      @keyframes boot-icon-in {
        from { opacity: 0; transform: scale(0.8) translateY(16px); }
        to   { opacity: 1; transform: scale(1)   translateY(0);     }
      }

      @keyframes boot-text-in {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: translateY(0);    }
      }

      @keyframes boot-glow-pulse {
        0%, 100% { opacity: 0.65; transform: scale(1);    }
        50%       { opacity: 1;    transform: scale(1.1);  }
      }

      @keyframes boot-sweep {
        0%   { transform: translateX(-80%); opacity: 0;   }
        12%  { opacity: 1; }
        88%  { opacity: 1; }
        100% { transform: translateX(80%);  opacity: 0;   }
      }

      @keyframes boot-progress {
        from { width: 12%; }
        to   { width: 88%; }
      }
    </style>
  </head>
  <body style="background: #050508; color: #c5c6cb;">
    <div id="root">
      <div class="boot-splash">
        <div class="boot-cover-main">
          <div class="boot-mark" aria-hidden="true">
            <img src="/pwa-icon.svg" alt="" />
          </div>
          <div class="boot-text">
            <div class="boot-label">3T Novelgame</div>
            <div class="boot-title">命运干涉</div>
            <div class="boot-tagline">可分享 · 可改写的互动故事引擎</div>
          </div>
        </div>
        <div class="boot-progress-wrap" aria-label="启动进度">
          <div class="boot-progress">
            <div class="boot-progress-fill"></div>
          </div>
          <div class="boot-percent" id="boot-pct">LOADING</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
