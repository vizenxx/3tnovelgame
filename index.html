      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="命运干涉：在手机和桌面上都能顺畅游玩的互动故事应用。" />
    <meta property="og:type" content="website" />

    <meta property="og:title" content="命运干涉｜可分享、可改写的互动故事引擎" />

    <meta property="og:image" content="/pwa-icon-512.png" />
    <meta property="og:image:alt" content="命运干涉应用图标" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="命运干涉｜可分享、可改写的互动故事引擎" />
    <meta name="twitter:description" content="阅读别人分享的故事记录，或把时间线带回命运干涉，亲自改写新的结局。" />
    <meta name="twitter:image" content="/pwa-icon-512.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="命运干涉" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/pwa-icon.svg" />
    <link rel="apple-touch-icon" href="/pwa-icon-192.png" />
    <title>命运干涉</title>
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        background: #09090b;
        color: #f4f4f5;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #root {
        min-height: 100dvh;
      }

      .boot-splash {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        text-align: center;
        padding: 24px;
        background:
          radial-gradient(circle at top, rgba(99, 102, 241, 0.18), transparent 40%),
          #09090b;
      }

      .boot-spinner {
        width: 36px;
        height: 36px;
        border-radius: 9999px;
        border: 3px solid rgba(99, 102, 241, 0.18);
        border-top-color: #818cf8;
        animation: boot-spin 0.9s linear infinite;
      }

      .boot-label {
        font-size: 14px;
        color: #a1a1aa;
        letter-spacing: 0.08em;
      }

      .boot-title {
        font-size: clamp(32px, 7vw, 52px);
        line-height: 1;
        font-weight: 900;
        letter-spacing: -0.04em;
        color: #ffffff;
      }

      .boot-subtitle {
        max-width: 360px;
        font-size: 14px;
        line-height: 1.7;
        color: #a1a1aa;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash">
        <div class="boot-title">命运干涉</div>
        <div class="boot-subtitle">正在整理你的故事记录与时间线，请稍候片刻。</div>
        <div class="boot-spinner" aria-hidden="true"></div>
        <div class="boot-label">正在接通命运干涉...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
