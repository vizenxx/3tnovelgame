    <meta name="twitter:image" content="/pwa-icon-512.png" />

    <link rel="apple-touch-icon" href="/pwa-icon-192.png" />
    <title>命运干涉</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #202024;
        color: #d9d9d9;
        color-scheme: dark;
        font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      }

      #root {
        min-height: 100dvh;
        background: #202024;
      }

      .boot-splash {
        position: relative;
        display: flex;
        min-height: 100dvh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        text-align: center;
        background:
          radial-gradient(circle at 50% 18%, rgba(129, 140, 248, 0.22), transparent 32%),
          radial-gradient(circle at 88% 78%, rgba(244, 63, 94, 0.13), transparent 28%),
          linear-gradient(180deg, #2d2d33 0%, #262629 46%, #202024 100%);
      }

      .boot-cover-main {
        display: flex;
        min-height: 52dvh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
      }

      .boot-label {
        color: #858585;
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .boot-title {
        color: #d9d9d9;
        font-size: clamp(36px, 9vw, 58px);
        font-weight: 900;
        letter-spacing: -0.04em;
        line-height: 1;
        text-shadow: 0 18px 48px rgba(0, 0, 0, 0.38);
      }

      .boot-mark {
        position: relative;
        display: grid;
        width: 88px;
        height: 88px;
        place-items: center;
        border: 1px solid rgba(129, 140, 248, 0.28);
        border-radius: 30px;
        background:
          radial-gradient(circle at 32% 24%, rgba(217, 217, 217, 0.18), transparent 22%),
          linear-gradient(135deg, rgba(129, 140, 248, 0.22), rgba(244, 63, 94, 0.12));
        box-shadow: 0 20px 70px rgba(99, 102, 241, 0.22);
        animation: boot-float 2.6s ease-in-out infinite;
      }

      .boot-mark img {
        width: 56px;
        height: 56px;
        object-fit: contain;
      }

      .boot-progress-wrap {
        position: fixed;
        bottom: max(42px, calc(env(safe-area-inset-bottom) + 32px));
        left: 50%;
        width: min(280px, 72vw);
        transform: translateX(-50%);
      }

      .boot-progress {
        height: 4px;
        overflow: hidden;
        border: 1px solid rgba(217, 217, 217, 0.08);
        border-radius: 999px;
        background: rgba(38, 38, 38, 0.72);
        box-shadow: inset 0 1px 8px rgba(0, 0, 0, 0.3);
      }

      .boot-progress-fill {
        width: 18%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #818cf8, #c084fc, #fb7185);
        animation: boot-progress 6.5s ease-out forwards;
      }

      .boot-subtitle {
        margin-top: 12px;
        color: #a6a6a6;
        font-size: 13px;
        line-height: 1.6;
      }

      .boot-percent {
        margin-top: 10px;
        color: #858585;
        font-size: 10px;
        font-weight: 900;
        letter-spacing: 0.22em;
      }

      @keyframes boot-float {
        0%,
        100% {
          transform: translateY(0) rotate(0deg);
        }

        50% {
          transform: translateY(-8px) rotate(3deg);
        }
      }

      @keyframes boot-progress {
        from {
          width: 18%;
        }

        to {
          width: 86%;
        }
      }
    </style>
  </head>
  <body style="background: #202024; color: #d9d9d9;">
    <div id="root">
      <div class="boot-splash">
        <div class="boot-cover-main">
          <div class="boot-mark" aria-hidden="true">
            <img src="/pwa-icon.svg" alt="" />
          </div>
          <div class="boot-label">3T Novelgame</div>
          <div class="boot-title">命运干涉</div>
        </div>
        <div class="boot-progress-wrap" aria-label="启动进度">
          <div class="boot-progress">
            <div class="boot-progress-fill"></div>
          </div>
          <div class="boot-subtitle">正在连接时空枢纽，请稍候片刻。</div>
          <div class="boot-percent">LOADING</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
